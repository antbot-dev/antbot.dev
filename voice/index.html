<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AntBot Voice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Dépendances dans l'ordre : livekit d'abord, puis @11labs/client -->
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@latest/dist/livekit-client.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@11labs/client@latest/dist/lib.umd.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --bg-card: #16161a;
      --border: #1e1e24;
      --text: #e8e8ed;
      --text-secondary: #7a7a85;
      --text-muted: #4a4a55;
      --accent: #c8ff00;
      --accent-glow: #c8ff0040;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .container {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2.5rem;
      position: relative; z-index: 1;
    }

    .header { text-align: center; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
    .logo { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; }
    .title { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; }
    .title span { color: var(--accent); }
    .subtitle { font-size: 0.85rem; color: var(--text-secondary); font-weight: 300; }

    /* ORB */
    .orb-zone { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }

    .glow {
      position: absolute; width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.6s; pointer-events: none;
    }
    .orb-zone.active .glow { opacity: 1; }

    .ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent) 0%, transparent 40%, var(--accent) 100%);
      opacity: 0; transition: opacity 0.4s; animation: spin 2s linear infinite; pointer-events: none;
    }
    .orb-zone.active .ring { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .orb-btn {
      position: absolute; inset: 3px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.4rem;
      transition: border-color 0.3s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      z-index: 2;
    }
    .orb-btn:active { transform: scale(0.95); }
    .orb-zone.active .orb-btn { border-color: transparent; }

    .orb-emoji { font-size: 2.8rem; transition: transform 0.3s; }
    .orb-zone.active .orb-emoji { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

    .orb-hint { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); transition: color 0.3s; }
    .orb-zone.active .orb-hint { color: var(--accent); }

    /* Waveform */
    .waveform { display: flex; align-items: center; gap: 4px; height: 36px; opacity: 0; transition: opacity 0.4s; }
    .waveform.on { opacity: 1; }
    .bar { width: 3px; border-radius: 99px; background: var(--accent); animation: wave 1.4s ease-in-out infinite; height: 4px; }
    .bar:nth-child(1){animation-delay:0s}.bar:nth-child(2){animation-delay:.15s}.bar:nth-child(3){animation-delay:.3s}
    .bar:nth-child(4){animation-delay:.45s}.bar:nth-child(5){animation-delay:.3s}.bar:nth-child(6){animation-delay:.15s}.bar:nth-child(7){animation-delay:0s}
    @keyframes wave { 0%,100%{height:4px;opacity:.2} 50%{height:28px;opacity:1} }

    .status { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.3s; min-height: 1em; }
    .status.on { color: var(--accent); }

    .transcript {
      width: min(360px, 88vw); background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.25rem; font-size: 0.875rem; line-height: 1.6;
      color: var(--text-secondary); font-style: italic; min-height: 60px;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }

    .error { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #ff6b6b; text-align: center; display: none; max-width: 320px; }
    .error.on { display: block; }

    .footer { position: fixed; bottom: 1.5rem; font-size: 0.65rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; z-index: 1; }
    .footer a { color: inherit; text-decoration: none; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🤖 AntBot</div>
      <h1 class="title">Voice <span>Mode</span></h1>
      <p class="subtitle">Appuie sur l'orb pour parler</p>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:1.5rem">
      <div class="orb-zone" id="orbZone">
        <div class="glow"></div>
        <div class="ring"></div>
        <button class="orb-btn" id="orbBtn">
          <span class="orb-emoji" id="orbEmoji">🎙️</span>
          <span class="orb-hint" id="orbHint">Appuie</span>
        </button>
      </div>

      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="status" id="status">Prêt</div>
    </div>

    <div class="transcript" id="transcript">La conversation apparaîtra ici…</div>
    <div class="error" id="errorEl"></div>
  </div>

  <div class="footer"><a href="https://antbot.dev">antbot.dev</a></div>

  <script>
    const AGENT_ID = 'agent_6701km7v5mj1ebj9ptk48t8dtdxf';

    const orbZone  = document.getElementById('orbZone');
    const orbEmoji = document.getElementById('orbEmoji');
    const orbHint  = document.getElementById('orbHint');
    const waveform = document.getElementById('waveform');
    const statusEl = document.getElementById('status');
    const transcript = document.getElementById('transcript');
    const errorEl  = document.getElementById('errorEl');

    let conv = null;
    let active = false;

    function setActive(on) {
      active = on;
      orbZone.classList.toggle('active', on);
      waveform.classList.toggle('on', on);
      statusEl.classList.toggle('on', on);
      orbEmoji.textContent = on ? '🔴' : '🎙️';
      orbHint.textContent  = on ? 'En call' : 'Appuie';
      statusEl.textContent = on ? 'En écoute…' : 'Prêt';
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('on');
      statusEl.textContent = 'Erreur';
    }

    document.getElementById('orbBtn').addEventListener('click', async () => {
      if (active) {
        // Raccrocher
        if (conv) await conv.endSession();
        setActive(false);
        return;
      }

      errorEl.classList.remove('on');
      statusEl.textContent = 'Connexion…';

      try {
        // Vérifier que le SDK est chargé
        if (typeof window.client === 'undefined' || !window.client.Conversation) {
          throw new Error('SDK pas encore chargé — réessaie dans 2s');
        }

        // Unlock AudioContext iOS
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') await ctx.resume();
        } catch(e) {}

        // Demander micro
        try {
          const s = await navigator.mediaDevices.getUserMedia({ audio: true });
          s.getTracks().forEach(t => t.stop());
        } catch(e) {
          throw new Error(e.name === 'NotAllowedError' ? 'Micro refusé — autorise dans les réglages' : 'Erreur micro: ' + e.message);
        }

        conv = await window.client.Conversation.startSession({
          agentId: AGENT_ID,
          onConnect: () => setActive(true),
          onDisconnect: () => { setActive(false); conv = null; },
          onError: (e) => showError('Erreur: ' + (e.message || JSON.stringify(e))),
          onModeChange: ({ mode }) => {
            statusEl.textContent = mode === 'speaking' ? 'AntBot parle…' : 'En écoute…';
          },
          onMessage: ({ message, source }) => {
            if (message) {
              transcript.textContent = (source === 'user' ? '→ Toi : ' : '← AntBot : ') + message;
              transcript.style.cssText = 'font-style:normal;color:var(--text);text-align:left;justify-content:flex-start';
            }
          }
        });

      } catch(err) {
        showError(err.message || String(err));
      }
    });
  </script>
</body>
</html>

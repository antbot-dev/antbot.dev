<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AntBot Voice · Gemini</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --bg-card: #16161a;
      --border: #1e1e24;
      --text: #e8e8ed;
      --text-secondary: #7a7a85;
      --text-muted: #4a4a55;
      --accent: #c8ff00;
      --accent-glow: #c8ff0040;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .container {
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2.5rem;
      position: relative; z-index: 1;
      padding: 1.25rem;
    }

    .header { text-align: center; display: flex; flex-direction: column; gap: 0.5rem; align-items: center; }
    .logo { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.2em; text-transform: uppercase; }
    .title { font-family: 'JetBrains Mono', monospace; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.03em; }
    .title span { color: var(--accent); }
    .subtitle { font-size: 0.85rem; color: var(--text-secondary); font-weight: 300; }

    .orb-zone { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }

    .glow {
      position: absolute; width: 280px; height: 280px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.6s; pointer-events: none;
    }
    .orb-zone.active .glow { opacity: 1; }

    .ring {
      position: absolute; inset: -3px; border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent) 0%, transparent 40%, var(--accent) 100%);
      opacity: 0; transition: opacity 0.4s; animation: spin 2s linear infinite; pointer-events: none;
    }
    .orb-zone.active .ring { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .orb-btn {
      position: absolute; inset: 3px; border-radius: 50%;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.4rem;
      transition: border-color 0.3s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
      z-index: 2;
    }
    .orb-btn:active { transform: scale(0.95); }
    .orb-btn[disabled] { cursor: wait; opacity: 0.95; }
    .orb-zone.active .orb-btn { border-color: transparent; }

    .orb-emoji { font-size: 2.8rem; transition: transform 0.3s; }
    .orb-zone.active .orb-emoji { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

    .orb-hint { font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); transition: color 0.3s; }
    .orb-zone.active .orb-hint { color: var(--accent); }

    .waveform { display: flex; align-items: center; gap: 4px; height: 36px; opacity: 0; transition: opacity 0.4s; }
    .waveform.on { opacity: 1; }
    .bar { width: 3px; border-radius: 99px; background: var(--accent); animation: wave 1.4s ease-in-out infinite; height: 4px; }
    .bar:nth-child(1){animation-delay:0s}.bar:nth-child(2){animation-delay:.15s}.bar:nth-child(3){animation-delay:.3s}
    .bar:nth-child(4){animation-delay:.45s}.bar:nth-child(5){animation-delay:.3s}.bar:nth-child(6){animation-delay:.15s}.bar:nth-child(7){animation-delay:0s}
    @keyframes wave { 0%,100%{height:4px;opacity:.2} 50%{height:28px;opacity:1} }

    .status { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.3s; min-height: 1em; }
    .status.on { color: var(--accent); }

    .transcript {
      width: min(420px, 88vw); background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.25rem; font-size: 0.875rem; line-height: 1.6;
      color: var(--text-secondary); font-style: italic; min-height: 88px;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }

    .error { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #ff6b6b; text-align: center; display: none; max-width: 360px; }
    .error.on { display: block; }

    .footer { position: fixed; bottom: 1.5rem; font-size: 0.65rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; z-index: 1; }
    .footer a { color: inherit; text-decoration: none; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🤖 AntBot</div>
      <h1 class="title">Voice <span>Gemini</span></h1>
      <p class="subtitle">Assistant commercial IA — Powered by Gemini 3.1 Flash Live</p>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:1.5rem">
      <div class="orb-zone" id="orbZone">
        <div class="glow"></div>
        <div class="ring"></div>
        <button class="orb-btn" id="orbBtn" aria-label="Démarrer ou arrêter la conversation vocale">
          <span class="orb-emoji" id="orbEmoji">🎙️</span>
          <span class="orb-hint" id="orbHint">Appuie</span>
        </button>
      </div>

      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="status" id="status">Prêt</div>
    </div>

    <div class="transcript" id="transcript">Touchez l'orb pour lancer une conversation de qualification en temps réel.</div>
    <div class="error" id="errorEl"></div>
  </div>

  <div class="footer"><a href="https://antbot.dev" target="_blank" rel="noreferrer">antbot.dev</a></div>

  <script>
    const WS_URL = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/voice-goog/ws`;
    const MODEL = 'models/gemini-3.1-flash-live-preview';
    const INPUT_SAMPLE_RATE = 16000;
    const OUTPUT_SAMPLE_RATE = 24000;
    const CHUNK_SIZE = 2048;

    const SYSTEM_PROMPT = `Tu es AntBot, SDR vocal d'AntBot, et tu parles uniquement en français naturel, chaleureux et concis.

Ton rôle:
- Accueillir chaleureusement le prospect.
- Comprendre son contexte avant de pitcher.
- Qualifier avec tact: activité, taille d'équipe ou d'entreprise, volume de demandes/messages, outils actuels, irritants, urgence, budget implicite.
- Présenter AntBot comme un agent IA autonome, always-on, natif WhatsApp, capable de répondre, qualifier, relancer et automatiser des workflows commerciaux et support.
- Mentionner clairement le prix de départ: 250€ par mois.
- Traiter les objections sans réciter un script.
- Chercher à obtenir un rendez-vous démo.

Points de vente AntBot:
- Agent IA autonome, pas juste un chatbot figé.
- Disponible 24/7.
- Natif WhatsApp, donc très simple pour les équipes et les prospects.
- Peut qualifier, répondre, relancer, orchestrer des actions et centraliser les échanges.
- Rapide à déployer.
- Tarification simple: 250€/mois pour démarrer.

Méthode de conversation:
1. Commence par une salutation brève et humaine.
2. Pose une première question ouverte sur leur besoin.
3. Creuse avec 1 ou 2 questions max à la fois, jamais un interrogatoire.
4. Reformule brièvement pour montrer que tu as compris.
5. Fais un pitch adapté au contexte du prospect.
6. Si objection prix: compare au coût d'un lead perdu, d'un standard humain ou d'un temps commercial gaspillé.
7. Si objection "on a déjà un chatbot": souligne qu'AntBot agit comme un agent opérationnel et conversationnel sur WhatsApp, pas seulement une FAQ.
8. Si objection "pas le moment": propose une démo rapide pour voir si cela vaut le coup, sans engagement.
9. Conclus souvent par une micro-prochaine étape vers une démo.

Style:
- Ton oral, simple, crédible.
- Phrases plutôt courtes.
- Pas de jargon inutile.
- Pas de listes à rallonge.
- Ne dis jamais que tu es un modèle ou une IA de Google.
- Si l'utilisateur demande quelque chose hors sujet, ramène doucement la conversation sur son besoin commercial et la démo.`;

    const orbZone = document.getElementById('orbZone');
    const orbBtn = document.getElementById('orbBtn');
    const orbEmoji = document.getElementById('orbEmoji');
    const orbHint = document.getElementById('orbHint');
    const waveform = document.getElementById('waveform');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const errorEl = document.getElementById('errorEl');

    let ws = null;
    let audioContext = null;
    let mediaStream = null;
    let sourceNode = null;
    let processorNode = null;
    let isSessionActive = false;
    let isSetupComplete = false;
    let currentState = 'idle';
    let playbackCursor = 0;
    let playbackSources = new Set();

    function setTranscript(text, spoken = false) {
      transcriptEl.textContent = text;
      if (spoken) {
        transcriptEl.style.cssText = 'font-style:normal;color:var(--text);text-align:left;justify-content:flex-start';
      } else {
        transcriptEl.style.cssText = 'font-style:italic;color:var(--text-secondary);text-align:center;justify-content:center';
      }
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('on');
      setState('idle');
    }

    function clearError() {
      errorEl.classList.remove('on');
      errorEl.textContent = '';
    }

    function setState(nextState) {
      currentState = nextState;
      const activeVisual = nextState === 'connecting' || nextState === 'listening' || nextState === 'speaking';
      orbZone.classList.toggle('active', activeVisual);
      waveform.classList.toggle('on', activeVisual);
      statusEl.classList.toggle('on', activeVisual);

      if (nextState === 'idle') {
        orbEmoji.textContent = '🎙️';
        orbHint.textContent = 'Appuie';
        statusEl.textContent = 'Prêt';
        orbBtn.disabled = false;
      } else if (nextState === 'connecting') {
        orbEmoji.textContent = '⌛';
        orbHint.textContent = 'Connexion';
        statusEl.textContent = 'Connexion…';
        orbBtn.disabled = true;
      } else if (nextState === 'listening') {
        orbEmoji.textContent = '🔴';
        orbHint.textContent = 'En écoute';
        statusEl.textContent = 'En écoute…';
        orbBtn.disabled = false;
      } else if (nextState === 'speaking') {
        orbEmoji.textContent = '🗣️';
        orbHint.textContent = 'AntBot parle';
        statusEl.textContent = 'AntBot parle…';
        orbBtn.disabled = false;
      }
    }

    function float32ToInt16PCM(float32Array) {
      const output = new Int16Array(float32Array.length);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        output[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return output;
    }

    function int16ToBase64(int16Array) {
      const bytes = new Uint8Array(int16Array.buffer);
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToInt16(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Int16Array(bytes.buffer);
    }

    function int16ToFloat32(int16Array) {
      const float32 = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32[i] = int16Array[i] / 0x8000;
      }
      return float32;
    }

    function stopPlayback() {
      playbackSources.forEach(source => {
        try { source.stop(0); } catch (_) {}
      });
      playbackSources.clear();
      if (audioContext) playbackCursor = audioContext.currentTime;
    }

    function playPCMChunk(base64Data) {
      if (!audioContext) return;
      const int16 = base64ToInt16(base64Data);
      const float32 = int16ToFloat32(int16);
      const audioBuffer = audioContext.createBuffer(1, float32.length, OUTPUT_SAMPLE_RATE);
      audioBuffer.copyToChannel(float32, 0);

      const source = audioContext.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioContext.destination);
      source.onended = () => playbackSources.delete(source);
      playbackSources.add(source);

      const startAt = Math.max(audioContext.currentTime + 0.02, playbackCursor);
      source.start(startAt);
      playbackCursor = startAt + audioBuffer.duration;
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: OUTPUT_SAMPLE_RATE });
      }
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }
    }

    function sendJSON(payload) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    async function setupMicrophoneStreaming() {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          sampleRate: INPUT_SAMPLE_RATE,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

      sourceNode = audioContext.createMediaStreamSource(mediaStream);
      processorNode = audioContext.createScriptProcessor(CHUNK_SIZE, 1, 1);

      processorNode.onaudioprocess = (event) => {
        if (!isSessionActive || !isSetupComplete || !ws || ws.readyState !== WebSocket.OPEN) return;

        const inputData = event.inputBuffer.getChannelData(0);
        const pcm = float32ToInt16PCM(inputData);
        const base64 = int16ToBase64(pcm);

        sendJSON({
          realtimeInput: {
            mediaChunks: [{
              mimeType: 'audio/pcm;rate=16000',
              data: base64
            }]
          }
        });
      };

      sourceNode.connect(processorNode);
      processorNode.connect(audioContext.destination);
    }

    async function startSession() {
      clearError();
      setTranscript('Connexion au live Gemini…', false);
      setState('connecting');

      try {
        await ensureAudioContext();
        playbackCursor = audioContext.currentTime;

        ws = new WebSocket(WS_URL);

        ws.onopen = async () => {
          sendJSON({
            setup: {
              model: MODEL,
              generationConfig: {
                responseModalities: ['AUDIO'],
                speechConfig: {
                  voiceConfig: {
                    prebuiltVoiceConfig: {
                      voiceName: 'Orus'
                    }
                  }
                }
              },
              systemInstruction: {
                parts: [{ text: SYSTEM_PROMPT }]
              }
            }
          });
        };

        ws.onmessage = async (event) => {
          let message;
          try {
            message = JSON.parse(event.data);
          } catch (err) {
            console.warn('Message non JSON reçu', err);
            return;
          }

          if (message.setupComplete) {
            isSessionActive = true;
            isSetupComplete = true;
            await setupMicrophoneStreaming();
            setState('listening');
            setTranscript('Conversation lancée. Parlez naturellement, AntBot vous écoute.', false);
            return;
          }

          if (message.serverContent) {
            const serverContent = message.serverContent;

            if (serverContent.interrupted) {
              stopPlayback();
              setState('listening');
            }

            const modelTurn = serverContent.modelTurn;
            if (modelTurn && Array.isArray(modelTurn.parts)) {
              for (const part of modelTurn.parts) {
                if (part.text) {
                  setTranscript('← AntBot : ' + part.text, true);
                }
                if (part.inlineData && part.inlineData.data) {
                  setState('speaking');
                  playPCMChunk(part.inlineData.data);
                  if (!part.text) {
                    setTranscript('← AntBot est en train de répondre à voix haute…', true);
                  }
                }
              }
            }

            if (serverContent.turnComplete) {
              const delay = Math.max(0, (playbackCursor - audioContext.currentTime) * 1000 + 30);
              window.setTimeout(() => {
                if (isSessionActive) setState('listening');
              }, delay);
            }
          }

          if (message.error) {
            throw new Error(message.error.message || 'Erreur Gemini Live');
          }
        };

        ws.onerror = () => {
          showError('Connexion WebSocket impossible. Vérifiez la clé API ou la disponibilité du service.');
          stopSession(false);
        };

        ws.onclose = () => {
          if (isSessionActive || currentState === 'connecting') {
            stopSession(false);
          }
        };
      } catch (error) {
        showError(error.message || String(error));
        await stopSession(false);
      }
    }

    async function stopSession(resetTranscript = true) {
      isSessionActive = false;
      isSetupComplete = false;
      stopPlayback();

      if (processorNode) {
        processorNode.disconnect();
        processorNode.onaudioprocess = null;
        processorNode = null;
      }

      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      if (ws) {
        const socket = ws;
        ws = null;
        try { socket.close(); } catch (_) {}
      }

      setState('idle');
      if (resetTranscript) {
        setTranscript('Session terminée. Touchez l\'orb pour relancer la conversation.', false);
      }
    }

    orbBtn.addEventListener('click', async () => {
      if (currentState === 'connecting') return;
      if (isSessionActive || isSetupComplete) {
        await stopSession(true);
        return;
      }
      await startSession();
    });

    window.addEventListener('beforeunload', () => {
      stopSession(false);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ant Boat 🛳️ · Voice SDR</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛳️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0b; --bg-card: #16161a; --border: #1e1e24; --border-hover: #2a2a33;
      --text: #e8e8ed; --text-secondary: #7a7a85; --text-muted: #4a4a55;
      --accent: #4285f4; --accent-glow: #4285f440;
      --accent-green: #34a853; --accent-red: #ea4335; --accent-yellow: #fbbc05;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }
    body::after { content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 600px; height: 600px; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); pointer-events: none; transition: opacity .5s; opacity: 0; }
    body.active::after { opacity: 1; }
    .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; }
    .header { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
    .logo { font-family: 'JetBrains Mono', monospace; font-size: .75rem; font-weight: 500; color: var(--text-muted); letter-spacing: .15em; text-transform: uppercase; }
    .title { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; letter-spacing: -.03em; }
    .title span { color: var(--accent); }
    .subtitle { font-size: .875rem; color: var(--text-secondary); font-weight: 300; }
    .gemini-badge { display: inline-flex; align-items: center; gap: .35rem; font-family: 'JetBrains Mono', monospace; font-size: .6rem; color: var(--text-muted); letter-spacing: .1em; text-transform: uppercase; background: var(--bg-card); border: 1px solid var(--border); padding: .25rem .6rem; border-radius: 4px; margin-top: .25rem; }
    .gemini-dots { display: flex; gap: 2px; }
    .gemini-dots span { width: 5px; height: 5px; border-radius: 50%; }
    .gemini-dots span:nth-child(1) { background: var(--accent); }
    .gemini-dots span:nth-child(2) { background: var(--accent-red); }
    .gemini-dots span:nth-child(3) { background: var(--accent-yellow); }
    .gemini-dots span:nth-child(4) { background: var(--accent-green); }
    .orb { position: relative; width: 140px; height: 140px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .3s; -webkit-tap-highlight-color: transparent; user-select: none; }
    .orb::before { content: ''; position: absolute; inset: -1px; border-radius: 50%; background: conic-gradient(from 0deg, var(--accent), var(--accent-red), var(--accent-yellow), var(--accent-green), var(--accent)); opacity: 0; transition: opacity .3s; animation: spin 3s linear infinite; }
    .orb::after { content: ''; position: absolute; inset: 1px; border-radius: 50%; background: var(--bg-card); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orb:hover { border-color: var(--border-hover); }
    .orb.listening::before { opacity: 1; }
    .orb.speaking::before { opacity: .5; }
    .orb-icon { position: relative; z-index: 1; font-size: 2.5rem; transition: all .3s; color: var(--text-secondary); }
    .waveform { display: flex; align-items: center; gap: 3px; height: 32px; opacity: 0; transition: opacity .4s; }
    .waveform.visible { opacity: 1; }
    .bar { width: 3px; border-radius: 3px; animation: wave 1.2s ease-in-out infinite; height: 4px; }
    .bar:nth-child(1) { animation-delay: 0s; background: var(--accent); }
    .bar:nth-child(2) { animation-delay: .1s; background: var(--accent-red); }
    .bar:nth-child(3) { animation-delay: .2s; background: var(--accent-yellow); }
    .bar:nth-child(4) { animation-delay: .3s; background: var(--accent-green); }
    .bar:nth-child(5) { animation-delay: .2s; background: var(--accent); }
    .bar:nth-child(6) { animation-delay: .1s; background: var(--accent-red); }
    .bar:nth-child(7) { animation-delay: 0s; background: var(--accent-yellow); }
    @keyframes wave { 0%, 100% { height: 4px; opacity: .3; } 50% { height: 24px; opacity: 1; } }
    .status { font-family: 'JetBrains Mono', monospace; font-size: .7rem; color: var(--text-muted); letter-spacing: .1em; text-transform: uppercase; min-height: 1.2em; }
    .status.active { color: var(--accent); }
    .status.speaking-status { color: var(--accent-green); }
    .transcript-zone { width: min(480px, 90vw); min-height: 80px; max-height: 180px; overflow-y: auto; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; font-size: .85rem; line-height: 1.5; color: var(--text-secondary); font-style: italic; }
    .transcript-zone.has-content { border-color: var(--border-hover); font-style: normal; }
    .msg { margin-bottom: .4rem; color: var(--text); }
    .msg.user { color: var(--text-secondary); }
    .msg .label { font-family: 'JetBrains Mono', monospace; font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; margin-right: .4rem; }
    .msg.user .label { color: var(--text-muted); }
    .msg.agent .label { color: var(--accent); }
    .end-btn { font-family: 'JetBrains Mono', monospace; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: .5rem 1.25rem; border-radius: 6px; cursor: pointer; transition: all .2s; display: none; }
    .end-btn:hover { border-color: var(--accent-red); color: var(--accent-red); }
    .end-btn.visible { display: block; }
    .footer { position: fixed; bottom: 1rem; font-size: .65rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .footer a { color: var(--text-muted); text-decoration: none; }
    .debug { position: fixed; bottom: 2.5rem; font-size: .55rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; max-width: 90vw; text-align: center; opacity: .6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🛳️ Ant Boat</div>
      <h1 class="title">Voice <span>SDR</span></h1>
      <p class="subtitle">SDR IA · Go1 — Appel de prospection</p>
      <div class="gemini-badge">
        <div class="gemini-dots"><span></span><span></span><span></span><span></span></div>
        Gemini 3.1 Flash Live
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1.5rem">
      <div class="orb" id="orb"><span class="orb-icon" id="orbIcon">🛳️</span></div>
      <div class="waveform" id="waveform"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      <div class="status" id="status">Appuie pour démarrer</div>
    </div>
    <div class="transcript-zone" id="transcript">La conversation apparaîtra ici…</div>
    <button class="end-btn" id="endBtn" onclick="endCall()">⏹ Terminer</button>
  </div>
  <div class="debug" id="debug"></div>
  <div class="footer"><a href="https://antbot.dev">antbot.dev</a> · Gemini Live API</div>

<script>
const API_KEY = 'REDACTED_API_KEY';
const MODEL = 'models/gemini-3.1-flash-live-preview';
const WS_URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${API_KEY}`;

const SYSTEM_PROMPT = `Tu es Sophie, SDR IA chez Go One (prononcé "Go Ouane"). Tu appelles des prospects.

## RÈGLES ABSOLUES
- "Go1" → prononcer "Go Ouane"
- JAMAIS de question fermée ("vous avez 5 minutes ?", "je vous dérange ?", "ça vous intéresse ?")
- TOUJOURS des questions ouvertes ("comment ça se passe chez vous sur…", "qu'est-ce qui bloque…")
- Phrases COURTES. Tu es au téléphone, pas en conférence.
- UNE seule question à la fois. Attends la réponse.
- Laisse des silences — le silence fait parler le prospect.
- Écoute active : rebondis sur CE QUE DIT le prospect.
- Tu ne vends PAS. Tu accompagnes.

## SCRIPT — ORDRE STRICT

### Étape 1 — Accroche
Dis exactement : "Allô ? Vous m'entendez ?"
Rien d'autre. Attends la réponse.

### Étape 2 — Ouverture honnête (style Enzo Colucci)
"Parfait ! Je suis Sophie de Go Ouane. Je suppose que je vous dérange — je vais être directe : je vous appelle parce qu'on vient de sortir un ebook sur l'IA appliquée à la formation en entreprise, et c'est un sujet qui revient partout en ce moment. Comment ça se passe chez vous là-dessus ?"

### Étape 3 — Rebondir et qualifier
- "Qu'est-ce qui bloque aujourd'hui ?"
- "C'est quoi votre priorité là ?"
- "Comment vous gérez la formation aujourd'hui ?"

### Étape 4 — Capture email
"L'ebook fait une vingtaine de pages avec des cas concrets — Sopra Stéria, Michelin. Vous voulez que je vous l'envoie ? C'est quoi votre adresse email ?"
Si email donné → répète pour confirmer.

### Étape 5 — Qualification bonus
"Et juste par curiosité — vous êtes dans quelle boîte ? Et combien de personnes à former ?"

### Étape 6 — Closing avec RDV
"Je vous propose mardi à 10h ou jeudi à 15h — qu'est-ce qui vous convient ?"

## OBJECTIONS (méthode AQPR)
- "Pas intéressé" → "Je comprends. Qu'est-ce qui vous fait dire ça ?"
- "Envoyez un email" → "Bien sûr. Mais avant — sur le sujet IA, vos équipes ont accès à des formations ?"
- "On a déjà une solution" → "C'est quoi comme plateforme ? Vous en êtes satisfait ?"
- "Tu es une IA ?" → "Oui, je suis Sophie, l'assistante IA de Go Ouane ! L'ebook est bien réel."

## PREMIER MESSAGE : "Allô ? Vous m'entendez ?" — rien d'autre.`;

// --- State ---
let ws = null, isActive = false;
let micStream = null, micCtx = null, micProcessor = null;
let playCtx = null, playWorklet = null, playGain = null;
let playbackInitialized = false;

const $ = id => document.getElementById(id);

function dbg(s) { console.log('[AB]', s); $('debug').textContent = s; }
function setStatus(t, c='') { $('status').textContent = t; $('status').className = 'status ' + c; }

function setOrb(state) {
  $('orb').className = 'orb ' + (state||'');
  $('orbIcon').textContent = state === 'listening' ? '🎙️' : state === 'speaking' ? '🔊' : '🛳️';
  $('waveform').classList.toggle('visible', !!state);
  document.body.classList.toggle('active', !!state);
}

let hasTranscriptContent = false;
function addMsg(role, text) {
  if (!text || !text.trim()) return;
  const el = $('transcript');
  if (!hasTranscriptContent) { el.textContent = ''; hasTranscriptContent = true; }
  el.classList.add('has-content');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<span class="label">${role==='user'?'→ Prospect':'← Sophie'}</span>${text}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

// --- Safe base64 ---
function toB64(buf) {
  const u8 = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) {
    s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i+8192, u8.length)));
  }
  return btoa(s);
}

// --- Playback via BufferSource queue (Safari compatible) ---
let playQueue = [], playing = false, nextPlayTime = 0;

async function initPlayback() {
  if (playbackInitialized) return;
  // Don't force sampleRate — Safari iOS only supports 44100/48000
  playCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (playCtx.state === 'suspended') await playCtx.resume();
  playGain = playCtx.createGain();
  playGain.gain.value = 1.0;
  playGain.connect(playCtx.destination);
  nextPlayTime = playCtx.currentTime;
  playbackInitialized = true;
  dbg('Play ready (' + playCtx.sampleRate + 'Hz)');
}

let audioChunksReceived = 0;
function playAudio(b64) {
  if (!playbackInitialized) { dbg('Play not init!'); return; }
  if (playCtx.state === 'suspended') playCtx.resume();

  audioChunksReceived++;

  try {
    const raw = atob(b64);
    const u8 = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    const i16 = new Int16Array(u8.buffer);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

    // createBuffer(channels, length, sampleRate) — 24kHz is the data rate
    // AudioContext will automatically resample to its native rate
    const buf = playCtx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);

    const src = playCtx.createBufferSource();
    src.buffer = buf;
    src.connect(playGain);

    const now = playCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    src.start(nextPlayTime);
    nextPlayTime += buf.duration;

    if (audioChunksReceived <= 3 || audioChunksReceived % 10 === 0) {
      dbg('Audio #' + audioChunksReceived + ' len:' + f32.length + ' dur:' + buf.duration.toFixed(2) + 's ctx:' + playCtx.state);
    }

    src.onended = () => {
      if (isActive && nextPlayTime <= playCtx.currentTime + 0.05) {
        setStatus('En écoute', 'active');
        setOrb('listening');
      }
    };

    setStatus('Sophie parle…', 'speaking-status');
    setOrb('speaking');
  } catch(e) {
    dbg('Play err: ' + e.message);
  }
}

function interruptPlayback() {
  // Reset play time to force next chunk to play immediately
  nextPlayTime = playCtx ? playCtx.currentTime : 0;
}

// --- Microphone ---
function downsample(f32, from, to) {
  if (from === to) return f32;
  const ratio = from / to;
  const len = Math.floor(f32.length / ratio);
  const out = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    const idx = i * ratio;
    const lo = Math.floor(idx), hi = Math.min(lo+1, f32.length-1);
    out[i] = f32[lo] * (1 - (idx-lo)) + f32[hi] * (idx-lo);
  }
  return out;
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  micCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (micCtx.state === 'suspended') await micCtx.resume();
  const nativeRate = micCtx.sampleRate;
  dbg('Mic: ' + nativeRate + 'Hz');

  const src = micCtx.createMediaStreamSource(micStream);
  micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
  let chunkN = 0;

  micProcessor.onaudioprocess = e => {
    if (!ws || ws.readyState !== 1) return;
    const raw = e.inputBuffer.getChannelData(0);
    const down = downsample(raw, nativeRate, 16000);
    const i16 = new Int16Array(down.length);
    for (let i = 0; i < down.length; i++) {
      const s = Math.max(-1, Math.min(1, down[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const b64 = toB64(i16.buffer);
    try {
      ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: 'audio/pcm', data: b64 } } }));
    } catch(e) {}
    chunkN++;
    if (chunkN % 25 === 0) {
      let mx = 0;
      for (let i = 0; i < raw.length; i++) { const a = Math.abs(raw[i]); if (a > mx) mx = a; }
      dbg('Mic chunk #' + chunkN + ' level:' + mx.toFixed(3));
    }
  };

  src.connect(micProcessor);
  // Muted output to prevent feedback, but ScriptProcessor needs destination connection
  const mute = micCtx.createGain();
  mute.gain.value = 0;
  micProcessor.connect(mute);
  mute.connect(micCtx.destination);
}

function stopMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx && micCtx.state !== 'closed') { micCtx.close().catch(()=>{}); micCtx = null; }
  micProcessor = null;
}

// --- WebSocket ---
function connect() {
  return new Promise((resolve, reject) => {
    dbg('Connecting...');
    ws = new WebSocket(WS_URL);
    const to = setTimeout(() => { reject(new Error('Timeout')); ws.close(); }, 10000);

    ws.onopen = () => {
      dbg('WS open');
      ws.send(JSON.stringify({
        setup: {
          model: MODEL,
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: 'Orus' } } }
          },
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      }));
    };

    ws.onmessage = async ev => {
      let data = ev.data;
      if (data instanceof Blob) data = await data.text();
      try {
        const msg = JSON.parse(data);

        if (msg.setupComplete) {
          clearTimeout(to);
          dbg('Setup OK ✓');
          // Trigger bot to speak first
          setTimeout(() => {
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({
                realtimeInput: { text: 'Bonjour, commence ton accroche maintenant.' }
              }));
              dbg('Trigger sent');
            }
          }, 500);
          resolve();
          return;
        }

        if (msg.serverContent) {
          const sc = msg.serverContent;
          dbg('Server msg: parts=' + (sc.modelTurn?.parts?.length||0) + ' tc=' + !!sc.turnComplete + ' int=' + !!sc.interrupted);
          const parts = sc.modelTurn?.parts || [];
          for (const p of parts) {
            if (p.inlineData?.data) playAudio(p.inlineData.data);
          }
          if (sc.inputTranscription?.text) addMsg('user', sc.inputTranscription.text);
          if (sc.outputTranscription?.text) addMsg('agent', sc.outputTranscription.text);
          if (sc.turnComplete) {
            dbg('Turn complete');
            if (isActive) { setStatus('En écoute', 'active'); setOrb('listening'); }
          }
          if (sc.interrupted) {
            dbg('Interrupted');
            interruptPlayback();
            if (isActive) { setStatus('En écoute', 'active'); setOrb('listening'); }
          }
        }
      } catch(e) { dbg('Parse err: ' + e.message); }
    };

    ws.onerror = () => { clearTimeout(to); reject(new Error('WS error')); };
    ws.onclose = ev => {
      dbg('WS closed: ' + ev.code + ' ' + (ev.reason||''));
      if (isActive) endCall();
    };
  });
}

// --- Controls ---
$('orb').onclick = async () => {
  if (isActive) return;
  try {
    setStatus('Connexion…');
    // Init playback FIRST (needs user gesture on iOS)
    await initPlayback();
    await connect();
    await startMic();
    isActive = true;
    setStatus('En écoute', 'active');
    setOrb('listening');
    $('endBtn').classList.add('visible');
  } catch(e) {
    dbg('Error: ' + e.message);
    setStatus('Erreur — réessaie');
    setOrb('');
    stopMic();
    if (ws) { ws.close(); ws = null; }
  }
};

function endCall() {
  isActive = false;
  stopMic();
  interruptPlayback();
  if (ws) { ws.close(); ws = null; }
  setStatus('Appuie pour démarrer');
  setOrb('');
  $('endBtn').classList.remove('visible');
  dbg('Call ended');
}
</script>
</body>
</html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

<script>
const MODEL = 'models/gemini-3.1-flash-live-preview';

// Voice from URL param ?voice=xxx (default: Orus)
const VOICES = ['Puck','Charon','Kore','Fenrir','Aoede','Orus','Leda','Perseus'];
const VOICE = new URLSearchParams(location.search).get('voice') || 'Aoede';

// Key fetched from server — never in source code or URL
let API_KEY = null, WS_URL = null;
fetch('/voice-goog/config.json').then(r => r.json()).then(c => {
  API_KEY = c.key;
  WS_URL = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${API_KEY}`;
}).catch(() => { document.getElementById('status').textContent = 'Erreur config'; });

const SYSTEM_PROMPT = `Tu es Sophie, SDR chez Go One (prononcé "Go Ouane"). Tu appelles des prospects par téléphone.

## PRONONCIATION
- "Go1" ou "Go One" → toujours dire "Go Ouane"
- "Coorpacademy" → "Corp Academy"

## TON & STYLE
- Voix douce, souriante, naturelle — pas commerciale
- Phrases COURTES. Une idée par phrase.
- UNE seule question à la fois, puis tu attends
- Laisse des silences — le prospect remplira le vide
- Rebondis sur ce qu'il DIT (écoute active)
- Tu accompagnes, tu ne vends pas
- Jamais de question fermée en ouverture

## SCRIPT — SUIS CET ORDRE

### Étape 1 — Accroche
Dis exactement : "Allô ? Vous m'entendez ?"
Attends la réponse.

### Étape 2 — Opener doux (prétexte LinkedIn)
"Bonjour ! C'est Sophie de Go Ouane. Je vous appelle parce que j'ai vu que vous aviez liké notre post sur LinkedIn, celui sur l'ebook IA et Formation. Et je voulais savoir si vous l'aviez bien reçu ?"
Attends.
"Vous vous souvenez ?"
Attends.

Si elle se souvient → "Super ! Vous avez eu le temps de le parcourir ?"
Si elle ne se souvient PAS ou pas sûre → "En fait on a eu un petit bug d'envoi sur certains contacts. L'ebook est vraiment bien, il fait une vingtaine de pages avec des cas concrets. Ça vous intéresse que je vous le renvoie ?"

### Étape 3 — Capture email
Si intéressée → "Parfait ! C'est quoi votre adresse email que je vous l'envoie tout de suite ?"
Quand elle donne l'email → répète-le pour confirmer. "Top, je vous envoie ça dans la minute."
Si pas intéressée → "Ok, pas de souci, je comprends tout à fait."
→ Passe directement à l'étape 4.

### Étape 4 — Pattern interrupt + pitch Go1
"Juste avant de raccrocher, j'ai une dernière petite question si vous permettez ?"
Attends le OK.
"Chez Go Ouane on aide les équipes Learning et formation à gagner du temps, en fournissant un catalogue sur étagère qui agrège les meilleurs fournisseurs de contenu e-learning — Cegos, Coursera, Corp Academy..."
Petite pause.
"Est-ce que vous utilisez déjà un LMS ?"
Attends la réponse.

### Étape 5 — Qualifier selon la réponse LMS
Si oui (a un LMS) → "Ok intéressant. C'est quoi comme plateforme ? Et vous en êtes satisfait ?"
→ Écoute, puis : "On s'intègre avec tous les LMS du marché — 360Learning, Cornerstone, Talentsoft, tous. En fait on vient compléter ce que vous avez déjà, pas le remplacer."

Si non (pas de LMS) → "D'accord. Et du coup, comment vous gérez la formation aujourd'hui ? C'est plutôt du présentiel, de l'informel ?"
→ Écoute et rebondis.

Si pas le bon interlocuteur → "Je comprends. Qui s'occupe de la formation chez vous ? Que je puisse le contacter directement."

### Étape 6 — Preuve sociale + RDV
"On travaille avec des boîtes comme Société Générale, Michelin, mais aussi des entreprises de 200-500 personnes dans le retail et l'industrie. Le feedback qu'on a c'est que ça leur fait gagner un temps fou sur le sourcing de contenu."
Petite pause.
"Si le sujet vous parle, comme là je vous appelle un peu à l'improviste, ce que j'aimerais c'est qu'on prenne juste 15-20 minutes pour que je vous montre ce qu'on propose. C'est sans engagement, et ça vous permet de faire de la veille sur votre domaine. Quel jour vous arrangerait ?"

### Si le prospect veut raccrocher à tout moment
→ Pattern interrupt : "Juste une dernière chose avant qu'on se quitte…"
→ Place une info utile ou une question ouverte pour relancer

## GESTION DES OBJECTIONS (méthode AQPR)

**"Je ne suis pas intéressé"**
→ Accepter : "Je comprends tout à fait."
→ Questionner : "Qu'est-ce qui vous fait dire ça ?"
→ Preuve : "Un DRH dans l'industrie nous avait dit la même chose, il a finalement lancé un pilote et ses managers ont adoré."
→ Re-proposer : si pas d'ouverture → "Pas de souci, bonne journée !"

**"Envoyez-moi un email"**
→ "Bien sûr, je le fais. Mais avant — juste par curiosité, comment vous gérez la formation aujourd'hui chez vous ?"

**"On a déjà un catalogue / une solution"**
→ "Ah intéressant ! C'est quoi comme fournisseur ? Et vous en êtes satisfait ?"
→ "Souvent nos clients gardent leur LMS et nous viennent en complément — on agrège plus de 100 000 contenus."

**"C'est pas le bon moment"**
→ "Je comprends. C'est quoi qui occupe votre agenda en ce moment ?"
→ "On peut recaler ça dans quelques semaines ? Quel jour vous arrangerait mieux ?"

**"C'est pas moi qui gère ça"**
→ "Pas de souci. Qui s'occupe du Learning & Development chez vous ? Que je puisse le contacter en mentionnant votre nom."

**"Tu es une IA ?"**
→ "Oui, je suis Sophie, l'assistante IA de Go Ouane ! Mais l'ebook est bien réel et les experts formation aussi. Vous voulez que je vous l'envoie ?"

**"C'est mon numéro perso !" / "Comment vous avez eu mon numéro ?"**
→ "Ah mince, je suis vraiment désolée ! En fait c'est le numéro qui est rattaché à votre profil LinkedIn."
→ "Je vais l'effacer juste après l'appel, pas de souci."
→ Enchaîne naturellement sur le sujet de l'appel sans insister sur le numéro.

## PROPOSITION DE RDV
Ne propose JAMAIS de dates précises toutes faites. Utilise plutôt cette formule :
"Comme là je vous appelle un peu à l'improviste, ce que j'aimerais c'est qu'on prenne juste 15-20 minutes pour que je vous montre ce qu'on propose. C'est sans engagement, et ça vous permet de faire de la veille sur les dernières nouveautés de votre domaine. Quel jour vous arrangerait ?"

## PREMIER MESSAGE
Dis exactement : "Allô ? Vous m'entendez ?"
Rien d'autre. Attends.`;

// --- State ---
let ws = null, isActive = false;
let micStream = null, micCtx = null, micProcessor = null;
let playCtx = null, playWorklet = null, playGain = null;
let playbackInitialized = false;

const $ = id => document.getElementById(id);

// Populate voice selector
const sel = $('voiceSelect');
VOICES.forEach(v => {
  const o = document.createElement('option');
  o.value = v; o.textContent = v;
  if (v === VOICE) o.selected = true;
  sel.appendChild(o);
});
sel.onchange = () => {
  const u = new URL(location);
  u.searchParams.set('voice', sel.value);
  location.href = u.toString();
};

function dbg(s) { console.log('[AB]', s); $('debug').textContent = s; }
function setStatus(t, c='') { $('status').textContent = t; $('status').className = 'status ' + c; }

function setOrb(state) {
  $('orb').className = 'orb ' + (state||'');
  $('orbIcon').textContent = state === 'speaking' ? '🔊' : '🎙️';
  $('waveform').classList.toggle('visible', !!state);
  document.body.classList.toggle('active', !!state);
}

let hasTranscriptContent = false;
function addMsg(role, text) {
  if (!text || !text.trim()) return;
  const el = $('transcript');
  if (!hasTranscriptContent) { el.textContent = ''; hasTranscriptContent = true; }
  el.classList.add('has-content');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = `<span class="label">${role==='user'?'→ Prospect':'← Sophie'}</span>${text}`;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

// --- Safe base64 ---
function toB64(buf) {
  const u8 = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < u8.length; i += 8192) {
    s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i+8192, u8.length)));
  }
  return btoa(s);
}

// --- Playback via BufferSource queue (Safari compatible) ---
let playQueue = [], playing = false, nextPlayTime = 0;

async function initPlayback() {
  if (playbackInitialized) return;
  // Don't force sampleRate — Safari iOS only supports 44100/48000
  playCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (playCtx.state === 'suspended') await playCtx.resume();
  playGain = playCtx.createGain();
  playGain.gain.value = 1.0;
  playGain.connect(playCtx.destination);
  nextPlayTime = playCtx.currentTime;
  playbackInitialized = true;
  dbg('Play ready (' + playCtx.sampleRate + 'Hz)');
}

let audioChunksReceived = 0;
function playAudio(b64) {
  if (!playbackInitialized) { dbg('Play not init!'); return; }
  if (playCtx.state === 'suspended') playCtx.resume();

  audioChunksReceived++;

  try {
    const raw = atob(b64);
    const u8 = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
    const i16 = new Int16Array(u8.buffer);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

    // createBuffer(channels, length, sampleRate) — 24kHz is the data rate
    // AudioContext will automatically resample to its native rate
    const buf = playCtx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);

    const src = playCtx.createBufferSource();
    src.buffer = buf;
    src.connect(playGain);

    const now = playCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    src.start(nextPlayTime);
    nextPlayTime += buf.duration;

    if (audioChunksReceived <= 3 || audioChunksReceived % 10 === 0) {
      dbg('Audio #' + audioChunksReceived + ' len:' + f32.length + ' dur:' + buf.duration.toFixed(2) + 's ctx:' + playCtx.state);
    }

    src.onended = () => {
      if (isActive && nextPlayTime <= playCtx.currentTime + 0.05) {
        setStatus('En écoute', 'active');
        setOrb('listening');
      }
    };

    setStatus('Sophie parle…', 'speaking-status');
    setOrb('speaking');
  } catch(e) {
    dbg('Play err: ' + e.message);
  }
}

function interruptPlayback() {
  // Reset play time to force next chunk to play immediately
  nextPlayTime = playCtx ? playCtx.currentTime : 0;
}

// --- Microphone ---
function downsample(f32, from, to) {
  if (from === to) return f32;
  const ratio = from / to;
  const len = Math.floor(f32.length / ratio);
  const out = new Float32Array(len);
  for (let i = 0; i < len; i++) {
    const idx = i * ratio;
    const lo = Math.floor(idx), hi = Math.min(lo+1, f32.length-1);
    out[i] = f32[lo] * (1 - (idx-lo)) + f32[hi] * (idx-lo);
  }
  return out;
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
  });
  micCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (micCtx.state === 'suspended') await micCtx.resume();
  const nativeRate = micCtx.sampleRate;
  dbg('Mic: ' + nativeRate + 'Hz');

  const src = micCtx.createMediaStreamSource(micStream);
  micProcessor = micCtx.createScriptProcessor(4096, 1, 1);
  let chunkN = 0;

  micProcessor.onaudioprocess = e => {
    if (!ws || ws.readyState !== 1) return;
    const raw = e.inputBuffer.getChannelData(0);
    const down = downsample(raw, nativeRate, 16000);
    const i16 = new Int16Array(down.length);
    for (let i = 0; i < down.length; i++) {
      const s = Math.max(-1, Math.min(1, down[i]));
      i16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const b64 = toB64(i16.buffer);
    try {
      ws.send(JSON.stringify({ realtimeInput: { audio: { mimeType: 'audio/pcm', data: b64 } } }));
    } catch(e) {}
    chunkN++;
    if (chunkN % 25 === 0) {
      let mx = 0;
      for (let i = 0; i < raw.length; i++) { const a = Math.abs(raw[i]); if (a > mx) mx = a; }
      dbg('Mic chunk #' + chunkN + ' level:' + mx.toFixed(3));
    }
  };

  src.connect(micProcessor);
  // Muted output to prevent feedback, but ScriptProcessor needs destination connection
  const mute = micCtx.createGain();
  mute.gain.value = 0;
  micProcessor.connect(mute);
  mute.connect(micCtx.destination);
}

function stopMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx && micCtx.state !== 'closed') { micCtx.close().catch(()=>{}); micCtx = null; }
  micProcessor = null;
}

// --- WebSocket ---
function connect() {
  return new Promise((resolve, reject) => {
    dbg('Connecting...');
    ws = new WebSocket(WS_URL);
    const to = setTimeout(() => { reject(new Error('Timeout')); ws.close(); }, 10000);

    ws.onopen = () => {
      dbg('WS open');
      ws.send(JSON.stringify({
        setup: {
          model: MODEL,
          generationConfig: {
            responseModalities: ['AUDIO'],
            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: VOICE } } }
          },
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          inputAudioTranscription: {},
          outputAudioTranscription: {}
        }
      }));
    };

    ws.onmessage = async ev => {
      let data = ev.data;
      if (data instanceof Blob) data = await data.text();
      try {
        const msg = JSON.parse(data);

        if (msg.setupComplete) {
          clearTimeout(to);
          dbg('Setup OK ✓');
          // Trigger bot to speak first
          setTimeout(() => {
            if (ws && ws.readyState === 1) {
              ws.send(JSON.stringify({
                realtimeInput: { text: 'Bonjour, commence ton accroche maintenant.' }
              }));
              dbg('Trigger sent');
            }
          }, 500);
          resolve();
          return;
        }

        if (msg.serverContent) {
          const sc = msg.serverContent;
          dbg('Server msg: parts=' + (sc.modelTurn?.parts?.length||0) + ' tc=' + !!sc.turnComplete + ' int=' + !!sc.interrupted);
          const parts = sc.modelTurn?.parts || [];
          for (const p of parts) {
            if (p.inlineData?.data) playAudio(p.inlineData.data);
          }
          if (sc.inputTranscription?.text) addMsg('user', sc.inputTranscription.text);
          if (sc.outputTranscription?.text) addMsg('agent', sc.outputTranscription.text);
          if (sc.turnComplete) {
            dbg('Turn complete');
            if (isActive) { setStatus('En écoute', 'active'); setOrb('listening'); }
          }
          if (sc.interrupted) {
            dbg('Interrupted');
            interruptPlayback();
            if (isActive) { setStatus('En écoute', 'active'); setOrb('listening'); }
          }
        }
      } catch(e) { dbg('Parse err: ' + e.message); }
    };

    ws.onerror = () => { clearTimeout(to); reject(new Error('WS error')); };
    ws.onclose = ev => {
      dbg('WS closed: ' + ev.code + ' ' + (ev.reason||''));
      if (isActive) endCall();
    };
  });
}

// --- Controls ---
$('orb').onclick = async () => {
  if (isActive) return;
  if (!API_KEY) { setStatus('Clé manquante — ajoute ?key=xxx'); return; }
  try {
    setStatus('Connexion…');
    // Init playback FIRST (needs user gesture on iOS)
    await initPlayback();
    await connect();
    await startMic();
    isActive = true;
    setStatus('En écoute', 'active');
    setOrb('listening');
    $('endBtn').classList.add('visible');
  } catch(e) {
    dbg('Error: ' + e.message);
    setStatus('Erreur — réessaie');
    setOrb('');
    stopMic();
    if (ws) { ws.close(); ws = null; }
  }
};

function endCall() {
  isActive = false;
  stopMic();
  interruptPlayback();
  if (ws) { ws.close(); ws = null; }
  setStatus('Appuie pour démarrer');
  setOrb('');
  $('endBtn').classList.remove('visible');
  dbg('Call ended');
}
</script>

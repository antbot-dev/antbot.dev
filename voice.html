<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AntBot Voice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --bg-card: #16161a;
      --border: #1e1e24;
      --text: #e8e8ed;
      --text-secondary: #7a7a85;
      --text-muted: #4a4a55;
      --accent: #c8ff00;
      --accent-glow: #c8ff0030;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-align: center;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .title span { color: var(--accent); }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 300;
    }

    /* Widget zone — override ElevenLabs styles */
    .widget-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Style the ElevenLabs widget button */
    elevenlabs-convai {
      --el-primary: #c8ff00;
      --el-background: #16161a;
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .footer a { color: var(--text-muted); text-decoration: none; }
    .footer a:hover { color: var(--accent); }

    /* Glow around widget */
    .glow-ring {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glow-ring::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🤖 AntBot</div>
      <h1 class="title">Voice <span>Mode</span></h1>
      <p class="subtitle">Parle directement avec AntBot</p>
    </div>

    <div class="widget-zone">
      <p class="hint">↓ Appuie pour démarrer</p>
      <div class="glow-ring">
        <elevenlabs-convai agent-id="agent_6701km7v5mj1ebj9ptk48t8dtdxf"></elevenlabs-convai>
      </div>
    </div>
  </div>

  <div class="footer"><a href="https://antbot.dev">antbot.dev</a></div>

  <script src="https://elevenlabs.io/convai-widget/index.js" async type="text/javascript"></script>
</body>
</html>
